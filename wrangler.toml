# Cloudflare Worker configuration.
#
# The site is a Worker with a static-assets binding: everything in public/ is
# served as a file, and src/index.js handles the /api routes. That is what
# `npx wrangler deploy` expects, which is the deploy command Cloudflare's
# repository import sets by default.

name = "give-get-grateful"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# The signup database.
#
# IMPORTANT: create it and paste the real id below BEFORE you connect this
# repo to Cloudflare. A build of a repo that still says
# PASTE_YOUR_DATABASE_ID_HERE has a D1 binding pointing at a database that
# does not exist, and there is nothing for Cloudflare to attach.
#
#   npx wrangler d1 create ggg-signups
#
# The id is an identifier, not a secret — committing it is expected.
[[d1_databases]]
binding = "DB"
database_name = "ggg-signups"
database_id = "5294e495-6e63-493f-a40d-8b2379391b5a"

# Secrets are NOT set here — they'd end up in git. Set them with:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put UNSUBSCRIBE_SECRET
#   npx wrangler secret put IP_SALT
#   npx wrangler secret put RESEND_API_KEY    # optional
# The two plain vars below are not secret and can live here, or be set in the
# dashboard:
# [vars]
# NOTIFY_TO   = "you@example.com"
# NOTIFY_FROM = "Give Get Grateful <hello@yourdomain.com>"
