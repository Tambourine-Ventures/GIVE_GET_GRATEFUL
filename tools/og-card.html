<!doctype html>
<!-- Source for public/og.jpg — the 1200x630 card shown when the site is shared.
     Open this file in a browser and screenshot the page at exactly 1200x630,
     or ask Claude to re-render it. Keep the output as JPEG: the PNG of the
     same card is ~5x larger for no visible gain. -->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Inter:wght@500;600&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; font-family:'Inter',sans-serif;
         background:linear-gradient(135deg,#FBF7F0 0%,#F3E6D5 100%); position:relative; }
  .blob { position:absolute; width:420px; height:420px; border-radius:50%;
          background:#B8502A; opacity:.07; top:-120px; right:-90px; }
  .inner { position:absolute; inset:0; padding:70px 80px; display:flex;
           align-items:center; gap:64px; }
  .copy { flex:1; display:flex; flex-direction:column; height:100%; }
  .eyebrow { font-size:20px; font-weight:600; letter-spacing:.20em; color:#B8502A; }
  h1 { font-family:'Fraunces',serif; font-weight:600; color:#241F1A;
       font-size:94px; line-height:1.0; letter-spacing:-.03em; margin-top:26px; }
  h1 em { font-style:italic; font-weight:400; color:#B8502A; }
  .rule { width:76px; height:5px; border-radius:3px; background:#C98A25; margin:32px 0 24px; }
  .sub { font-size:29px; line-height:1.35; color:#574C42; max-width:17ch; }
  .author { margin-top:auto; font-size:22px; font-weight:600; color:#8B7E71; }
  .cover { width:298px; height:447px; flex:none; border-radius:5px 10px 10px 5px;
           overflow:hidden; position:relative;
           box-shadow:0 26px 54px -20px rgba(60,20,10,.45); }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover::after { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.06) 4%,transparent 10%); }
</style></head>
<body>
  <div class="blob"></div>
  <div class="inner">
    <div class="copy">
      <div class="eyebrow">A BOOK &amp; A PRACTICE</div>
      <h1>Give, Get,<br><em>Grateful.</em></h1>
      <div class="rule"></div>
      <div class="sub">Three simple questions to access the wealth in the room.</div>
      <div class="author">Dr. Stacey Silkey Schultze</div>
    </div>
    <div class="cover"><img src="../public/cover.webp"></div>
  </div>
</body></html>
